<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body>
    <div class="play-section">
        <button id="button-1" class="button">
            <h1>A</h1>
            <p>CLAP</p>
        </button>
        <button id="button-2" class="button">
            <h1>S</h1>
            <p>HIHAT</p>
        </button>
        <button id="button-3" class="button">
            <h1>D</h1>
            <p>KICK</p>
        </button>
        <button id="button-4" class="button">
            <h1>F</h1>
            <p>OPENHAT</p>
        </button>
        <button id="button-5" class="button">
            <h1>G</h1>
            <p>BOOM</p>
        </button>
        <button id="button-6" class="button">
            <h1>H</h1>
            <p>RIDE</p>
        </button>
        <button id="button-7" class="button">
            <h1>J</h1>
            <p>SNARE</p>
        </button>
        <button id="button-8" class="button">
            <h1>K</h1>
            <p>TOM</p>
        </button>
        <button id="button-9" class="button">
            <h1>L</h1>
            <p>TINK</p>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
